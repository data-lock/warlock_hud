name: Package Warlock HUD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish or retry (for example v0.28.0)
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check addon Lua syntax and smoke tests
        run: |
          uv run --with lupa python tests/compile_lua.py
          uv run --with lupa python tests/cast_icon_smoke.py
          uv run --with lupa python tests/consumes_migration_smoke.py
          uv run --with lupa python tests/sharing_smoke.py
          uv run --with lupa python tests/consumables_smoke.py
          uv run --with lupa python tests/multitarget_smoke.py
          uv run --with lupa python tests/multitarget_damage_smoke.py
          uv run --with lupa python tests/debug_smoke.py
          uv run --with lupa python tests/shards_smoke.py
          uv run --with lupa python tests/anchor_widths_smoke.py
          uv run python tests/package_smoke.py
      - name: Run assignment smoke test with Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          lua5.1 tests/assignment_smoke.lua

  package:
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: release-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    env:
      PACKAGE_TAG: ${{ inputs.release_tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: bash
        run: |
          version="${PACKAGE_TAG#v}"
          grep -Fx "## Version: $version" Warlock_Hud.toc

      - name: Build installable ZIP
        shell: bash
        run: |
          python3 tools/package_addon.py dist/Warlock_Hud
          (cd dist && zip -q -r "Warlock_Hud-${PACKAGE_TAG}.zip" Warlock_Hud)
          unzip -Z1 "dist/Warlock_Hud-${PACKAGE_TAG}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Warlock_Hud-${{ env.PACKAGE_TAG }}
          path: dist/Warlock_Hud-${{ env.PACKAGE_TAG }}.zip
          if-no-files-found: error

      - name: Sync CurseForge project description
        if: github.ref == 'refs/heads/main'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::Set the CF_API_TOKEN repository secret before updating the description."
            exit 1
          fi
          metadata=$(jq -n --rawfile description CURSEFORGE_DESCRIPTION.md \
            '{description: $description, descriptionType: "markdown"}')
          curl --fail-with-body --show-error --silent \
            --header "X-Api-Token: ${CF_API_TOKEN}" \
            --form-string "metadata=${metadata}" \
            https://www.curseforge.com/api/projects/1727219/update-project

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          zip="dist/Warlock_Hud-${PACKAGE_TAG}.zip"
          if gh release view "$PACKAGE_TAG" >/dev/null 2>&1; then
            if ! gh release view "$PACKAGE_TAG" --json assets --jq '.assets[].name' | grep -Fx "Warlock_Hud-${PACKAGE_TAG}.zip"; then
              gh release upload "$PACKAGE_TAG" "$zip"
            fi
          else
            notes="releases/${PACKAGE_TAG}.md"
            if [ -f "$notes" ]; then
              gh release create "$PACKAGE_TAG" "$zip" \
                --verify-tag --title "Warlock HUD ${PACKAGE_TAG}" \
                --notes-file "$notes"
            else
              gh release create "$PACKAGE_TAG" "$zip" \
                --verify-tag --title "Warlock HUD ${PACKAGE_TAG}" \
                --generate-notes
            fi
          fi

      - name: Upload the same ZIP to CurseForge
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::Set the CF_API_TOKEN repository secret before publishing a tag."
            exit 1
          fi
          notes="releases/${PACKAGE_TAG}.md"
          if [ ! -f "$notes" ]; then notes="CHANGELOG.md"; fi
          metadata=$(jq -n --rawfile changelog "$notes" \
            --arg display_name "Warlock HUD ${PACKAGE_TAG}" \
            '{changelog: $changelog, changelogType: "markdown",
              displayName: $display_name, gameVersionNames: ["1.60.1"],
              releaseType: "release"}')
          curl --fail-with-body --show-error --silent \
            --header "X-Api-Token: ${CF_API_TOKEN}" \
            --form-string "metadata=${metadata}" \
            --form "file=@dist/Warlock_Hud-${PACKAGE_TAG}.zip" \
            https://www.curseforge.com/api/projects/1727219/upload-file
